name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Core / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build GUI
        run: ./scripts/build-gui.sh

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff (lint)
        if: matrix.python-version == '3.12'
        run: ruff check .

      - name: Mypy (type check)
        if: matrix.python-version == '3.12'
        run: mypy src/lele_manager

      - name: Verify core has no optional AI installation
        run: |
          python -c "import importlib.util; assert importlib.util.find_spec('giadaware_ai') is None"

      - name: Explicit optional AI collection must fail without the provider
        run: |
          python - <<'PY'
          import subprocess
          import sys

          result = subprocess.run(
              [sys.executable, "-m", "pytest", "--collect-only", "-q", "--optional-ai", "tests/optional_ai"],
              capture_output=True, text=True, check=False,
          )
          output = result.stdout + result.stderr
          print(output)
          assert result.returncode == 2, f"Expected collection failure, got {result.returncode}"
          assert "ERROR collecting" in output
          assert "No module named 'giadaware_ai'" in output
          PY

      - name: Core pytest (optional AI excluded before import)
        run: python -m pytest -q

  optional-ai:
    name: Optional AI / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install LeLe core and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Acquire exact qualified GitHub wheel and verify SHA-256 and identity
        run: python scripts/acquire-optional-ai.py download "$RUNNER_TEMP/optional-ai"

      - name: Install only the verified wheel (no index or dependency fallback)
        run: |
          python -m pip install --no-index --no-deps "$RUNNER_TEMP/optional-ai/giadaware_ai-0.0.2-py3-none-any.whl"
          python scripts/acquire-optional-ai.py verify-installed

      - name: Optional AI contracts (fake backends; network forbidden)
        run: python -m pytest -q --optional-ai tests/optional_ai

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build GUI
        run: ./scripts/build-gui.sh

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E smoke
        working-directory: frontend
        run: npm run test:e2e
        env:
          CI: "true"

  packaging-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build twine

      - name: Build sdist and wheel
        run: ./scripts/build-release-artifacts.sh

      - name: Install wheel in clean venv
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --upgrade pip
          /tmp/venv/bin/pip install dist/*.whl

      - name: Smoke CLI
        run: |
          /tmp/venv/bin/lele --help

      - name: Smoke installed wheel
        run: /tmp/venv/bin/python scripts/smoke-installed-package.py

      - name: Rebuild and install wheel from sdist
        run: |
          python -m pip wheel \
            --no-deps \
            --wheel-dir /tmp/sdist-wheel \
            dist/*.tar.gz
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install --upgrade pip
          /tmp/sdist-venv/bin/pip install /tmp/sdist-wheel/*.whl

      - name: Smoke sdist-rebuilt wheel
        run: |
          /tmp/sdist-venv/bin/lele --help
          /tmp/sdist-venv/bin/python \
            scripts/smoke-installed-package.py

  required-test:
    name: test
    runs-on: ubuntu-latest
    needs: [test, optional-ai, e2e, packaging-smoke]
    if: always()
    steps:
      - name: Verify required CI jobs succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os

          results = json.loads(os.environ["NEEDS_JSON"])
          failed = {name: job["result"] for name, job in results.items() if job["result"] != "success"}
          if failed:
              raise SystemExit(f"Required CI jobs did not all succeed: {failed}")
          print("All required CI jobs succeeded")
          PY

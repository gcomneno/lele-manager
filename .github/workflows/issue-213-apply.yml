name: Issue 213 patch runner

on:
  push:
    branches:
      - feat/issue-213-lesson-lifecycle
    paths:
      - .automation/issue-213-run

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-213-lesson-lifecycle
      - name: Apply guarded lifecycle patch
        run: |
          python .automation/issue-213-repair.py
          python .automation/issue-213-apply.py
      - name: Commit transformed sources
        run: |
          rm -f .automation/issue-213-run .automation/issue-213-apply.py .automation/issue-213-repair.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat: wire canonical lesson lifecycle"
          git push origin HEAD:feat/issue-213-lesson-lifecycle

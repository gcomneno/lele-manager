name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Publish Python artifacts to PyPI"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build twine
      - name: Build release artifacts
        run: ./scripts/build-release-artifacts.sh
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/*

  native-packages:
    name: Native package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
          - os: macos-latest
            platform: macOS
          - os: windows-latest
            platform: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build native application
        run: python scripts/build-native-app.py

      - name: Package native release
        run: python scripts/package-native-release.py

      - name: Smoke published-style native release
        run: python scripts/smoke-native-release.py

      - name: Upload native package
        uses: actions/upload-artifact@v6
        with:
          name: lele-manager-${{ matrix.platform }}
          path: dist/release/*
          if-no-files-found: error

  github-release:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    name: Publish GitHub Release
    needs:
      - native-packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download native packages
        uses: actions/download-artifact@v7
        with:
          pattern: lele-manager-*
          path: release-assets
          merge-multiple: true

      - name: Verify native assets
        shell: bash
        run: |
          shopt -s nullglob
          version="${GITHUB_REF_NAME#v}"
          assets=(release-assets/LeLe-Manager-v"${version}"-*)
          if (( ${#assets[@]} != 3 )); then
            printf 'Expected 3 native assets for %s, found %d\n' \
              "${GITHUB_REF_NAME}" "${#assets[@]}"
            printf '%s\n' "${assets[@]}"
            false
          fi
          printf 'Native release assets for %s:\n' "${GITHUB_REF_NAME}"
          printf '  %s\n' "${assets[@]}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/LeLe-Manager-v"${GITHUB_REF_NAME#v}"-* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "LeLe Manager ${GITHUB_REF_NAME}"


  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_pypi && vars.PYPI_ENABLED == 'true' }}
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

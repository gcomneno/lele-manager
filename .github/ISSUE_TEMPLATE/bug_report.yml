name: Bug report
description: Report a reproducible bug
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Provide reproducible details and remove sensitive data.
        If you attach a LeLe Manager diagnostic JSON file, review it first; do not paste secrets or unrelated logs.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what you expected and what you observed.
      placeholder: "I expected X, but observed Y..."
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Provide minimal steps, commands, and input.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Paste relevant output without sensitive data.
      render: shell
    validations:
      required: false
  - type: textarea
    id: diagnostics
    attributes:
      label: LeLe Manager diagnostics (optional)
      description: Review lele-manager-diagnostics-<version>.json before attaching it here. Do not paste secrets or unrelated logs.
      placeholder: Drag the reviewed diagnostic JSON file here if you choose to share it.
    validations:
      required: false
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "For example: 3.12.2"
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "For example: Ubuntu 24.04, macOS, or Windows"
    validations:
      required: false
